  <script>
    window.ANTHROPIC_KEY = "YOUR_API_KEY_HERE";
    window.SENTINEL_HUB_ID = "";

    // Storage using localStorage for persistence
    window.storage = {
      get: function(key) {
        return new Promise(function(resolve) {
          try {
            var val = localStorage.getItem(key);
            resolve(val ? {key: key, value: val} : null);
          } catch(e) { resolve(null); }
        });
      },
      set: function(key, value) {
        return new Promise(function(resolve) {
          try {
            localStorage.setItem(key, value);
            resolve({key: key, value: value});
          } catch(e) { resolve(null); }
        });
      },
      delete: function(key) {
        return new Promise(function(resolve) {
          try {
            localStorage.removeItem(key);
            resolve({key: key, deleted: true});
          } catch(e) { resolve(null); }
        });
      }
    };
  </script>

        .bindPopup('<div style="direction:rtl;font-family:Tajawal,sans-serif;min-width:180px"><b style="color:'+C.navy+'">KM '+z.km+'</b>'+(hasA?'<br><span style="color:'+C.red+';font-size:11px">🔴 \u062a\u0639\u062f\u064d \u0645\u0641\u062a\u0648\u062d</span>':'')+'<br><button onclick="window._rmSel&&window._rmSel(\''+z.id+'\')" style="margin-top:6px;background:'+C.navy+';color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;width:100%;font-family:Tajawal,sans-serif">🔍 \u062a\u062d\u0644\u064a\u0644</button></div>');
      mks.current.push(mk);
    });
    p.reports&&p.reports.filter(function(r){return r.status!=="\u0645\u063a\u0644\u0642";}).forEach(function(r){
      var col=SEV[r.severity]||C.red;
      var mk=window.L.marker([r.lat,r.lng],{icon:window.L.divIcon({className:"",html:'<div style="background:'+col+';color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.4)">⚠</div>',iconSize:[20,20],iconAnchor:[10,10]})})
        .addTo(m)
        .bindPopup('<div style="direction:rtl;font-family:Tajawal,sans-serif;min-width:180px"><b style="color:'+col+'">'+r.id+'</b><br><span style="font-size:12px">'+r.type+' — '+r.severity+'</span><br><small style="color:#6b7ea8">KM '+r.km+' · '+r.date+'</small><br><div style="font-family:monospace;font-size:10px;color:#6b7ea8;margin-top:3px">'+r.lat.toFixed(5)+'°N, '+r.lng.toFixed(5)+'°E</div><a href="'+navUrl(r.lat,r.lng)+'" target="_blank" style="display:block;margin-top:7px;background:'+C.navy+';color:#fff;text-align:center;padding:5px;border-radius:6px;font-size:11px;text-decoration:none">🧭 \u0645\u0644\u0627\u062d\u0629</a></div>');
      mks.current.push(mk);
    });
  }

  React.useEffect(function(){if(mp.current&&window.L)drawZones(mp.current);},[p.reports,p.bl]);
  React.useEffect(function(){if(p.flyTo&&mp.current)mp.current.flyTo([p.flyTo.lat,p.flyTo.lng],15,{duration:1.2});},[p.flyTo]);
  React.useEffect(function(){window._rmSel=p.onZone;},[p.onZone]);

  return (
    <div style={{position:"relative"}}>
      <div ref={ref} style={{width:"100%",height:p.h||380,borderRadius:10,border:"1px solid "+C.border}}/>
      <div style={{position:"absolute",top:10,right:10,background:"rgba(255,255,255,0.95)",borderRadius:9,padding:"8px 11px",border:"1px solid "+C.border,fontSize:10}}>
        <div style={{fontWeight:700,color:C.navy,marginBottom:5}}>{LINE.name}</div>
        <div style={{color:C.t3}}>{LINE.km} \u0643\u0645 · {LINE.towers} \u0628\u0631\u062c · {ZONES.length} \u0645\u0646\u0637\u0642\u0629</div>
        <div style={{marginTop:5,paddingTop:4,borderTop:"1px solid "+C.borderL,display:"flex",gap:8,color:C.t3,fontSize:9}}>
          <span>🔴 \u0646\u0634\u0637</span><span>✅ \u0645\u063a\u0644\u0642</span><span>⬤ \u0645\u0631\u062c\u0639</span>
        </div>
      </div>
    </div>
  );
}

// ── AI Analysis ──
async function runAI(zone, cUrl, pUrl, refD, curD) {
  var prompt = "رادار التعديات. "+LINE.name+" KM "+zone.km+" | \u062d\u0631\u0645 +-"+LINE.row+"\u0645\n"+
    "\u0635\u0648\u0631\u0629 \u0645\u0631\u062c\u0639: "+refD+" -> \u062d\u0627\u0644\u064a: "+curD+"\n"+
    "\u0642\u0627\u0631\u0646 \u062f\u0627\u062e\u0644 \u0627\u0644\u062d\u0631\u0645 \u0641\u0642\u0637. \u0623\u0646\u0648\u0627\u0639: \u0625\u0646\u0634\u0627\u0626\u064a/\u0632\u0631\u0627\u0639\u064a/\u0645\u062a\u062d\u0631\u0643/\u062d\u0641\u0631\u064a\u0627\u062a/\u0623\u062e\u0631\u0649\n"+
    "\u062e\u0637\u0648\u0631\u0629: \u062d\u0631\u062c(0-20\u0645)/\u0645\u062a\u0648\u0633\u0637(20-35\u0645)/\u0645\u0646\u062e\u0641\u0636(35-50\u0645)\n"+
    "JSON \u0641\u0642\u0637:\n"+
    "{\"detected\":true,\"encroachments\":[{\"type\":\"\u0625\u0646\u0634\u0627\u0626\u064a\",\"severity\":\"\u062d\u0631\u062c\",\"distance_m\":12,\"description\":\"\u0648\u0635\u0641\",\"confidence\":\"\u0639\u0627\u0644\u064a\u0629\"}],\"filtered_out\":\"\",\"assessment\":\"\"}\n"+
    "\u0644\u0627 \u062a\u0639\u062f\u064a\u0627\u062a:{\"detected\":false,\"encroachments\":[],\"filtered_out\":\"\",\"assessment\":\"\u0627\u0644\u062d\u0631\u0645 \u0622\u0645\u0646\"}";
  var res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json","x-api-key":window.ANTHROPIC_KEY||"","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-iab":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,messages:[{role:"user",content:[
      {type:"image",source:{type:"url",url:pUrl}},{type:"text",text:"\u0635\u0648\u0631\u0629 \u0627\u0644\u0645\u0631\u062c\u0639."},
      {type:"image",source:{type:"url",url:cUrl}},{type:"text",text:prompt}
    ]}]})
  });
  if(!res.ok) throw new Error("Claude "+res.status);
  var d = await res.json();
  var raw = d.content.map(function(c){return c.text||"";}).join("").replace(/```json|```/g,"").trim();
  return JSON.parse(raw);
}

// ── Scan Modal ──
function ScanModal(p) {
  var s1=React.useState(p.initZone||ZONES[0]); var zn=s1[0],setZn=s1[1];
  var s2=React.useState(doff(-35)); var refD=s2[0],setRefD=s2[1];
  var s3=React.useState(today()); var curD=s3[0],setCurD=s3[1];
  var s4=React.useState("idle"); var phase=s4[0],setPhase=s4[1];
  var s5=React.useState([]); var logs=s5[0],setLogs=s5[1];
  var s6=React.useState(0); var prog=s6[0],setProg=s6[1];
  var s7=React.useState(null); var rImg=s7[0],setRImg=s7[1];
  var s8=React.useState(null); var cImg=s8[0],setCImg=s8[1];
  var s9=React.useState(null); var result=s9[0],setResult=s9[1];
  var s10=React.useState(null); var scanErr=s10[0],setScanErr=s10[1];
  var blKey = zn.id;
  var base = p.bl[blKey];
  var running = phase==="loading" || phase==="analyzing";

  function addLog(msg,col){setLogs(function(old){return old.concat([{t:new Date().toLocaleTimeString("ar"),msg:msg,col:col||C.t3}]);});}

  function getUrl(d1,d2){
    if(p.iid&&p.iid.trim()){
      var d=0.006;
      return "https://services.sentinel-hub.com/ogc/wms/"+p.iid+"?SERVICE=WMS&REQUEST=GetMap&LAYERS=TRUE-COLOR-S2L2A&WIDTH=512&HEIGHT=512&CRS=EPSG:4326&BBOX="+(zn.lng-d)+","+(zn.lat-d)+","+(zn.lng+d)+","+(zn.lat+d)+"&TIME="+d1+"/"+d2+"&FORMAT=image/jpeg&MAXCC=30";
    }
    return cop(zn.lat,zn.lng,d1,d2);
  }

  async function run(){
    setLogs([]); setResult(null); setScanErr(null); setProg(0); setRImg(null); setCImg(null);
    setPhase("loading");
    addLog("Sentinel-2 KM "+zn.km,C.navy);
    addLog(LINE.name+" | +-"+LINE.row+"m");
    var pi = setInterval(function(){setProg(function(v){return Math.min(v+2,45);});},100);
    var d1 = new Date(new Date(refD).getTime()-10*86400000).toISOString().split("T")[0];
    var d1e = new Date(new Date(refD).getTime()+5*86400000).toISOString().split("T")[0];
    var d2 = new Date(new Date(curD).getTime()-5*86400000).toISOString().split("T")[0];
    var d2e = new Date(new Date(curD).getTime()+2*86400000).toISOString().split("T")[0];
    var rUrl = getUrl(d1,d1e);
    var cUrl = getUrl(d2,d2e);
    setRImg({url:rUrl,date:refD,src:p.iid?"Sentinel Hub":"Copernicus"});
    await new Promise(function(r){setTimeout(r,600);});
    setProg(52);
    setCImg({url:cUrl,date:curD,src:p.iid?"Sentinel Hub":"Copernicus"});
    await new Promise(function(r){setTimeout(r,500);});
    clearInterval(pi); setProg(65);
    setPhase("analyzing");
    addLog("Claude AI...",C.navy3);
    var pi2 = setInterval(function(){setProg(function(v){return Math.min(v+1.1,92);});},120);
    try {
      var res = await runAI(zn,cUrl,rUrl,refD,curD);
      clearInterval(pi2); setProg(100); setResult(res); setPhase("done");
      if(res.detected&&res.encroachments.length){
        addLog(res.encroachments.length+" \u062a\u0639\u062f\u064a\u0627\u062a",C.red);
      } else {
        addLog("\u0627\u0644\u062d\u0631\u0645 \u0622\u0645\u0646",C.green);
      }
      var nb = Object.assign({},base||{},{url:cUrl,date:today()});
      if(!nb.scanCount) nb.scanCount = 0;
      nb.scanCount = nb.scanCount + 1;
      var newBl = Object.assign({},p.bl);
      newBl[blKey] = nb;
      await p.saveBL(newBl);
      p.onResult({zone:zn,result:res,rUrl:rUrl,cUrl:cUrl,refDate:refD,curDate:curD,src:p.iid?"Sentinel Hub":"Copernicus"});
    } catch(e) {
      clearInterval(pi2);
      addLog("\u062e\u0637\u0623 - \u062a\u062c\u0631\u064a\u0628\u064a",C.amber); setScanErr("\u062a\u062c\u0631\u064a\u0628\u064a");
      var mock = {
        detected:true,
        encroachments:[
          {type:"\u0625\u0646\u0634\u0627\u0626\u064a",severity:"\u062d\u0631\u062c",distance_m:14,description:"\u0647\u064a\u0643\u0644 \u062c\u062f\u064a\u062f \u062f\u0627\u062e\u0644 \u0627\u0644\u062d\u0631\u0645",confidence:"\u0639\u0627\u0644\u064a\u0629"},
          {type:"\u0632\u0631\u0627\u0639\u064a",severity:"\u0645\u062a\u0648\u0633\u0637",distance_m:29,description:"\u0646\u0645\u0648 \u0646\u0628\u0627\u062a\u064a \u062f\u0627\u062e\u0644 \u0627\u0644\u062d\u0631\u0645",confidence:"\u0639\u0627\u0644\u064a\u0629"}
        ],
        filtered_out:"\u063a\u064a\u0648\u0645",
        assessment:"\u062a\u0639\u062f\u064a\u0627\u0646 \u0645\u0643\u062a\u0634\u0641\u0627\u0646"
      };
      setResult(mock); setProg(100); setPhase("done");
      var nb2 = {url:cUrl,date:today(),scanCount:1};
      var newBl2 = Object.assign({},p.bl);
      newBl2[blKey] = nb2;
      await p.saveBL(newBl2);
      p.onResult({zone:zn,result:mock,rUrl:rUrl,cUrl:cUrl,refDate:refD,curDate:curD,src:"\u062a\u062c\u0631\u064a\u0628\u064a"});
    }
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(26,46,94,0.65)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.white,borderRadius:14,width:"100%",maxWidth:880,maxHeight:"92vh",overflowY:"auto",direction:"rtl",boxShadow:"0 24px 80px rgba(26,46,94,0.4)"}}>
        <div style={{background:C.navy,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",borderRadius:"14px 14px 0 0"}}>
          <div><div style={{fontSize:15,fontWeight:700,color:C.white}}>{"\u062a\u062d\u0644\u064a\u0644 Sentinel-2 \u0628\u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064a"}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:2}}>{LINE.name}</div></div>
          <button onClick={p.onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",color:C.white,cursor:"pointer",width:32,height:32,borderRadius:"50%",fontSize:16}}>&#x2715;</button>
        </div>
        <div style={{padding:20,display:"grid",gridTemplateColumns:"270px 1fr",gap:15}}>
          <div style={{display:"flex",flexDirection:"column",gap:11}}>
            <div style={{background:C.bg,borderRadius:10,padding:"13px 14px",border:"1px solid "+C.borderL}}>
              <div style={{fontSize:10,fontWeight:700,color:C.navy,letterSpacing:".1em",marginBottom:10}}>{"\u0625\u0639\u062f\u0627\u062f \u0627\u0644\u0645\u0633\u062d"}</div>
              <label style={{fontSize:11,color:C.t2,display:"block",marginBottom:3,fontWeight:600}}>{"\u0627\u0644\u0645\u0646\u0637\u0642\u0629"}</label>
              <select value={zn.id} onChange={function(e){setZn(ZONES.find(function(z){return z.id===e.target.value;})||ZONES[0]);}} style={{width:"100%",marginBottom:9}}>
                {ZONES.map(function(z){return <option key={z.id} value={z.id}>{(p.bl[z.id]?"● ":"○ ")+"KM "+z.km}</option>;})}
              </select>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:9}}>
                <div><label style={{fontSize:10,color:C.t2,display:"block",marginBottom:3,fontWeight:600}}>{"\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u0645\u0631\u062c\u0639"}</label><input type="date" value={refD} onChange={function(e){setRefD(e.target.value);}} style={{width:"100%"}}/></div>
                <div><label style={{fontSize:10,color:C.t2,display:"block",marginBottom:3,fontWeight:600}}>{"\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u0631\u0635\u062f"}</label><input type="date" value={curD} onChange={function(e){setCurD(e.target.value);}} style={{width:"100%"}}/></div>
              </div>
              {(running||phase==="done")&&<div style={{background:C.bg,borderRadius:8,padding:"9px 10px",border:"1px solid "+C.borderL,marginBottom:9}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.t2,marginBottom:4}}>
                  <span>{phase==="loading"?"\u062a\u062d\u0645\u064a\u0644...":phase==="analyzing"?"AI...":"\u0627\u0643\u062a\u0645\u0644"}</span>
                  <span style={{fontFamily:"monospace",fontWeight:700,color:C.navy}}>{Math.round(prog)}%</span>
                </div>
                <div style={{height:4,background:C.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:prog+"%",background:"linear-gradient(90deg,"+C.navy+","+C.orange+")",borderRadius:2,transition:"width .2s"}}/></div>
              </div>}
              <button onClick={run} disabled={running} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",cursor:running?"not-allowed":"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,background:running?C.t4:"linear-gradient(135deg,"+C.navy+","+C.navy3+")",color:C.white,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
                {running?<><div style={{width:13,height:13,border:"2px solid rgba(255,255,255,.3)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>{"\u062c\u0627\u0631\u064d..."}</>:"🛰 Sentinel-2"}
              </button>
            </div>
            <div style={{background:C.bg,borderRadius:9,padding:"10px 12px",border:"1px solid "+C.borderL,flex:1}}>
              <div style={{fontSize:10,fontWeight:700,color:C.navy,marginBottom:6}}>{"\u0633\u062c\u0644 \u0627\u0644\u0639\u0645\u0644\u064a\u0627\u062a"}</div>
              <div style={{fontFamily:"monospace",fontSize:10,display:"flex",flexDirection:"column",gap:2,maxHeight:150,overflowY:"auto"}}>
                {logs.length===0?<span style={{color:C.t4,textAlign:"center",padding:"10px 0"}}>{"\u0627\u0646\u062a\u0638\u0627\u0631..."}</span>:logs.map(function(l,i){return <div key={i} style={{color:l.col||C.t3}}><span style={{color:C.t4,marginLeft:5}}>{l.t}</span>{l.msg}</div>;})}
                {phase==="done"&&!running&&<div style={{color:C.green,marginTop:2}}>✓ {"\u0627\u0643\u062a\u0645\u0644"}</div>}
              </div>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{background:C.bg,borderRadius:10,padding:"12px 13px",border:"1px solid "+C.borderL}}>
              <div style={{fontSize:11,fontWeight:700,color:C.navy,marginBottom:9}}>{"KM "+zn.km+" | +-"+LINE.row+"m"}</div>
              <div style={{display:"flex",gap:9}}>
                <div style={{flex:1}}><div style={{fontSize:10,color:C.t3,textAlign:"center",marginBottom:4}}>{"\u0627\u0644\u0645\u0631\u062c\u0639 - "+refD}</div>{rImg?<SatImg url={rImg.url} zone={zn} label={rImg.date} alerts={[]} src={rImg.src}/>:<div style={{height:190,background:C.white,borderRadius:8,border:"1px dashed "+C.border,display:"flex",alignItems:"center",justifyContent:"center",color:C.t4,fontSize:12}}>{"\u0627\u0646\u062a\u0638\u0627\u0631..."}</div>}</div>
                <div style={{display:"flex",flexDirection:"column",justifyContent:"center",gap:5,fontSize:20,color:C.t4,padding:"0 3px"}}><span>→</span>{result&&result.detected&&<span style={{fontSize:15,color:C.red}}>⚠</span>}</div>
                <div style={{flex:1}}><div style={{fontSize:10,color:C.t3,textAlign:"center",marginBottom:4}}>{"\u0627\u0644\u0631\u0635\u062f - "+curD}</div>{cImg?<SatImg url={cImg.url} zone={zn} label={cImg.date} alerts={result&&result.encroachments||[]} badge={result&&result.encroachments&&result.encroachments[0]?result.encroachments[0].severity:null} src={cImg.src}/>:<div style={{height:190,background:C.white,borderRadius:8,border:"1px dashed "+C.border,display:"flex",alignItems:"center",justifyContent:"center",color:C.t4,fontSize:12}}>{"\u0627\u0646\u062a\u0638\u0627\u0631..."}</div>}</div>
              </div>
            </div>
            {result&&<div style={{background:result.detected?"#fff5f5":"#f0fff4",borderRadius:10,padding:"12px 13px",border:"1px solid "+(result.detected?C.red+"44":C.green+"33")}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700,color:result.detected?C.red:C.green}}>{result.detected?"\uD83D\uDEA8 "+"\u062a\u0639\u062f\u064a\u0627\u062a \u0645\u0643\u062a\u0634\u0641\u0629":"\u2705 "+"\u0627\u0644\u062d\u0631\u0645 \u0622\u0645\u0646"}</div>
                {scanErr&&<Bdg label={scanErr} color={C.amber}/>}
              </div>
              <div style={{fontSize:12,color:C.t2,background:C.white,padding:"8px 10px",borderRadius:8,marginBottom:result.encroachments&&result.encroachments.length?9:0,lineHeight:1.9,border:"1px solid "+C.borderL}}>{result.assessment}</div>
              {result.encroachments&&result.encroachments.map(function(enc,i){
                var col=SEV[enc.severity]||C.red;
                return (
                  <div key={i} style={{background:C.white,borderRadius:8,padding:"9px 11px",marginBottom:6,borderRight:"4px solid "+col,border:"1px solid "+C.borderL,borderRightWidth:4,display:"grid",gridTemplateColumns:"auto 1fr auto",gap:9,alignItems:"center"}}>
                    <div style={{fontSize:20}}>{TIC[enc.type]||"\u26A0"}</div>
                    <div><div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3}}><span style={{fontSize:12,fontWeight:700,color:C.t1}}>{enc.type}</span><Bdg label={enc.severity} color={col}/>{enc.confidence&&<Bdg label={enc.confidence} color={C.t3}/>}</div><div style={{fontSize:11,color:C.t2}}>{enc.description}</div></div>
                    <div style={{textAlign:"center",background:col+"0d",border:"1px solid "+col+"33",borderRadius:8,padding:"5px 9px"}}><div style={{fontSize:16,fontWeight:800,color:col,fontFamily:"monospace"}}>{enc.distance_m||"?"}</div><div style={{fontSize:9,color:col}}>{"\u0645\u062a\u0631"}</div></div>
                  </div>
                );
              })}
              {result.detected&&result.encroachments&&result.encroachments.length>0&&<div style={{marginTop:5,padding:"7px 10px",background:C.green+"0d",borderRadius:8,fontSize:12,color:C.green,border:"1px solid "+C.green+"33"}}>✓ {"\u062a\u0645 \u0641\u062a\u062d \u0627\u0644\u0628\u0644\u0627\u063a \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b"}</div>}
            </div>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Login ──
function Login(p) {
  var s1=React.useState(""); var u=s1[0],setU=s1[1];
  var s2=React.useState(""); var pw=s2[0],setPw=s2[1];
  var s3=React.useState(""); var err=s3[0],setErr=s3[1];
  var s4=React.useState(false); var ld=s4[0],setLd=s4[1];
  function go(e){e.preventDefault();setErr("");setLd(true);setTimeout(function(){var f=USERS.find(function(x){return x.name===u&&x.pass===pw;});if(f)p.onLogin(f);else setErr("\u0628\u064a\u0627\u0646\u0627\u062a \u063a\u064a\u0631 \u0635\u062d\u064a\u062d\u0629");setLd(false);},700);}
  return (
    <div style={{minHeight:"100vh",background:C.navy,display:"flex",alignItems:"center",justifyContent:"center",direction:"rtl",padding:20}}>
      <div style={{position:"fixed",inset:0,backgroundImage:"radial-gradient(circle at 20% 50%,rgba(30,53,112,0.8),transparent 50%),radial-gradient(circle at 80% 20%,rgba(232,116,42,0.15),transparent 40%)",pointerEvents:"none"}}/>
      <div style={{width:"100%",maxWidth:440,position:"relative"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{background:"#fff",borderRadius:12,padding:"10px 18px",margin:"0 auto 12px",display:"inline-block",boxShadow:"0 2px 12px rgba(0,0,0,0.15)"}}><img src={LOGO_SRC} alt="National Grid SA" style={{width:160,height:"auto",display:"block"}}/></div>
          <div style={{fontSize:20,fontWeight:700,color:C.white}}>{"رادار التعديات"}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginTop:3}}>National Grid SA</div>
        </div>
        <div style={{background:C.white,borderRadius:14,padding:26,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
          <div style={{fontSize:14,fontWeight:700,color:C.navy,marginBottom:2}}>{"\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644"}</div>
          <div style={{fontSize:11,color:C.t3,marginBottom:18}}>{"\u0623\u062f\u062e\u0644 \u0628\u064a\u0627\u0646\u0627\u062a\u0643"}</div>
          <form onSubmit={go}>
            <div style={{marginBottom:10}}><label style={{fontSize:11,color:C.t2,display:"block",marginBottom:3,fontWeight:600}}>{"\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645"}</label><input value={u} onChange={function(e){setU(e.target.value);}} placeholder={"\u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0643\u0627\u0645\u0644"} style={{width:"100%",padding:"10px 12px",border:"1.5px solid "+C.border,borderRadius:9,fontFamily:"inherit",fontSize:13}}/></div>
            <div style={{marginBottom:10}}><label style={{fontSize:11,color:C.t2,display:"block",marginBottom:3,fontWeight:600}}>{"\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631"}</label><input type="password" value={pw} onChange={function(e){setPw(e.target.value);}} placeholder="●●●●●●●●" style={{width:"100%",padding:"10px 12px",border:"1.5px solid "+C.border,borderRadius:9,fontFamily:"inherit",fontSize:13}}/></div>
            {err&&<div style={{background:"#fff5f5",border:"1px solid "+C.red+"44",borderRadius:7,padding:"7px 11px",fontSize:12,color:C.red,marginBottom:10}}>{err}</div>}
            <button type="submit" disabled={ld||!u||!pw} style={{width:"100%",padding:"11px",borderRadius:10,border:"none",background:ld||!u||!pw?C.t4:"linear-gradient(135deg,"+C.navy+","+C.navy3+")",color:C.white,fontSize:13,fontWeight:700,cursor:ld||!u||!pw?"not-allowed":"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {ld?<><div style={{width:14,height:14,border:"2px solid rgba(255,255,255,.3)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>{"\u062c\u0627\u0631\u064a..."}</>:"⚡ "+"\u062f\u062e\u0648\u0644"}
            </button>
          </form>
          <div style={{marginTop:14,padding:"10px 12px",background:C.bg,borderRadius:9,border:"1px solid "+C.borderL}}>
            <div style={{fontSize:10,fontWeight:700,color:C.t3,marginBottom:7}}>{"\u062d\u0633\u0627\u0628\u0627\u062a \u062a\u062c\u0631\u064a\u0628\u064a\u0629"}</div>
            {USERS.map(function(uu){return(
              <div key={uu.id} onClick={function(){setU(uu.name);setPw(uu.pass);}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 7px",borderRadius:7,cursor:"pointer",marginBottom:3,transition:"background .15s"}} onMouseEnter={function(e){e.currentTarget.style.background=C.white;}} onMouseLeave={function(e){e.currentTarget.style.background="transparent";}}>
                <div style={{display:"flex",gap:7,alignItems:"center"}}>
                  <div style={{width:24,height:24,borderRadius:"50%",background:RC[uu.role]+"22",border:"1px solid "+RC[uu.role]+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{uu.role==="admin"?"👤":uu.role==="manager"?"🔧":"👷"}</div>
                  <div><div style={{fontSize:11,fontWeight:600,color:C.t1}}>{uu.name}</div><div style={{fontSize:10,color:C.t3}}>{uu.title}</div></div>
                </div>
                <Bdg label={RL[uu.role]} color={RC[uu.role]}/>
              </div>
            );})}
          </div>
        </div>
        <div style={{textAlign:"center",marginTop:12,fontSize:10,color:"rgba(255,255,255,0.25)"}}>{"\u0639\u0628\u062f\u0627\u0644\u0645\u062c\u064a\u062f \u0628\u0631\u064a\u062f\u0627\u0646 \u0627\u0644\u0639\u0646\u0632\u064a · 83289"}</div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  MAIN APP
// ══════════════════════════════════════════════════════
function App() {
  var s1=React.useState(null); var user=s1[0],setUser=s1[1];
  var s2=React.useState("dashboard"); var page=s2[0],setPage=s2[1];
  var s3=React.useState([]); var reports=s3[0],setReports=s3[1];
  var s4=React.useState({}); var bl=s4[0],setBL=s4[1];
  var s5=React.useState(false); var showScan=s5[0],setShowScan=s5[1];
  var s6=React.useState(false); var showAddLine=s6[0],setShowAddLine=s6[1];
  var s7=React.useState([]); var toasts=s7[0],setToasts=s7[1];
  var s8=React.useState(null); var sel=s8[0],setSel=s8[1];
  var s9=React.useState(""); var note=s9[0],setNote=s9[1];
  var s10=React.useState(null); var flyTo=s10[0],setFlyTo=s10[1];
  var s11=React.useState(null); var initZone=s11[0],setInitZone=s11[1];
  var s12=React.useState(""); var instanceId=s12[0],setInstanceId=s12[1];
  var s13=React.useState(false); var showCfg=s13[0],setShowCfg=s13[1];

  React.useEffect(function(){
    (async function(){try{var r=await window.storage.get("rr_rp");if(r&&r.value)setReports(JSON.parse(r.value));}catch(e){}})();
    (async function(){try{var r=await window.storage.get("rr_bl");if(r&&r.value)setBL(JSON.parse(r.value));}catch(e){}})();
    (async function(){try{var r=await window.storage.get("rr_sid");if(r&&r.value)setInstanceId(r.value);}catch(e){}})();
    window._rmSel = function(id){var z=ZONES.find(function(z){return z.id===id;});if(z){setInitZone(z);setShowScan(true);}};
  },[]);

  var saveBL = async function(b){setBL(b);try{await window.storage.set("rr_bl",JSON.stringify(b));}catch(e){}};
  var saveRP = async function(r){setReports(r);try{await window.storage.set("rr_rp",JSON.stringify(r));}catch(e){}};

  function toast(icon,title,body,color){
    var id=Date.now();
    setToasts(function(old){return old.concat([{id:id,icon:icon,title:title,body:body,color:color||C.navy}]);});
    setTimeout(function(){setToasts(function(old){return old.filter(function(t){return t.id!==id;});});},5000);
  }

  async function onResult(data){
    if(!data.result||!data.result.detected||!data.result.encroachments.length){toast("\u2705","\u0627\u0644\u062d\u0631\u0645 \u0622\u0645\u0646","KM "+data.zone.km,C.green);return;}
    var off=function(){return(Math.random()-0.5)*0.005;};
    var created=data.result.encroachments.map(function(enc){
      return {
        id:mkId(),type:enc.type||"\u0623\u062e\u0631\u0649",severity:enc.severity||"\u0645\u062a\u0648\u0633\u0637",
        description:enc.description,line:LINE.name,km:data.zone.km,zoneId:data.zone.id,
        lat:data.zone.lat+off(),lng:data.zone.lng+off(),
        distance_m:enc.distance_m,confidence:enc.confidence,
        status:"\u062c\u062f\u064a\u062f",date:today(),
        imgUrl:data.cUrl,prevImgUrl:data.rUrl,imgSrc:data.src,
        updates:[{date:todayAr(),text:"\u0643\u064f\u0634\u0641 ("+data.refDate+"->"+data.curDate+"): "+enc.description,by:"AI"}]
      };
    });
    var updated = created.concat(reports);
    await saveRP(updated);
    toast("\uD83D\uDEA8","\u062a\u0639\u062f\u064d \u0645\u0643\u062a\u0634\u0641",created.length+" - KM "+data.zone.km,C.red);
    setFlyTo({lat:data.zone.lat,lng:data.zone.lng});
  }

  async function updStatus(id,s){
    var upd={date:todayAr(),text:"\u062a\u062d\u062f\u064a\u062b: "+s,by:user?user.name:""};
    var updated=reports.map(function(r){return r.id===id?Object.assign({},r,{status:s,updates:r.updates.concat([upd])}):r;});
    await saveRP(updated);
    setSel(function(p){return p&&p.id===id?Object.assign({},p,{status:s,updates:p.updates.concat([upd])}):p;});
    toast("\u2705","\u062a\u0645 \u062a\u062d\u062f\u064a\u062b",id+" - "+s);
  }

  async function addNote(id){
    if(!note.trim())return;
    var upd={date:todayAr(),text:note,by:user?user.name:""};
    var updated=reports.map(function(r){return r.id===id?Object.assign({},r,{updates:r.updates.concat([upd])}):r;});
    await saveRP(updated);
    setSel(function(p){return p?Object.assign({},p,{updates:p.updates.concat([upd])}):p;});
    setNote("");
  }

  var openR = reports.filter(function(r){return r.status!=="\u0645\u063a\u0644\u0642";});
  var critR = reports.filter(function(r){return r.severity==="\u062d\u0631\u062c"&&r.status!=="\u0645\u063a\u0644\u0642";});
  var blCount = Object.keys(bl).length;

  var allTabs = [
    {id:"dashboard",l:"\u0644\u0648\u062d\u0629 \u0627\u0644\u062a\u062d\u0643\u0645",roles:["admin","manager","field"]},
    {id:"map",      l:"\u0627\u0644\u062e\u0631\u064a\u0637\u0629",             roles:["admin","manager","field"]},
    {id:"alerts",   l:"\u0627\u0644\u062a\u0646\u0628\u064a\u0647\u0627\u062a",  roles:["admin","manager","field"],badge:openR.length},
    {id:"photos",   l:"\u0635\u0648\u0631 \u0627\u0644\u062a\u0639\u062f\u064a\u0627\u062a",roles:["admin","manager"]},
    {id:"compare",  l:"\u0627\u0644\u0645\u0642\u0627\u0631\u0646\u0629",        roles:["admin","manager"]},
    {id:"reports",  l:"\u0627\u0644\u062a\u0642\u0627\u0631\u064a\u0631",        roles:["admin","manager"]},
  ];
  var tabs = user ? allTabs.filter(function(t){return t.roles.includes(user.role);}) : allTabs;

  if(!user) return <Login onLogin={function(u){setUser(u);toast("\u2705","\u0645\u0631\u062d\u0628\u0627\u064b, "+u.name,"",RC[u.role]);}}/>;

  return (
    <div dir="rtl" style={{fontFamily:"'IBM Plex Sans Arabic','Tajawal',sans-serif",display:"flex",flexDirection:"column",height:"100vh",background:C.bg,color:C.t1,overflow:"hidden"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#c5cfdf;border-radius:2px}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(0.85)}}
        @keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
        .fade{animation:fadeUp .28s ease both}
        input,textarea,select{font-family:inherit;background:#fff;border:1.5px solid #d1d9e8;color:#1a2744;border-radius:8px;padding:7px 11px;outline:none;font-size:12px;direction:rtl;transition:border-color .2s}
        input:focus,textarea:focus,select:focus{border-color:#1a2e5e}
        select option{background:#fff;color:#1a2744}
        .card{background:#fff;border:1px solid #d1d9e8;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(26,46,94,0.07)}
        .rrow{padding:10px 13px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;background:#fff;margin-bottom:7px;box-shadow:0 1px 3px rgba(26,46,94,0.06)}
        .rrow:hover{border-color:#1a2e5e44}.rrow.sel{border-color:#1a2e5e}
        a{text-decoration:none}
        .leaflet-popup-content-wrapper{border-radius:10px!important}
        .leaflet-popup-content{margin:12px 14px!important;font-family:'IBM Plex Sans Arabic',Tajawal,sans-serif!important}
      `}</style>

      {/* HEADER */}
      <header style={{background:C.navy,padding:"0 18px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54,flexShrink:0,boxShadow:"0 2px 8px rgba(26,46,94,0.3)"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          {(user.role==="admin"||user.role==="manager")&&(
            <button onClick={function(){setInitZone(null);setShowScan(true);}} style={{background:C.orange,color:C.white,border:"none",borderRadius:8,padding:"7px 15px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>⚡ {"\u062a\u062d\u0644\u064a\u0644 \u062c\u062f\u064a\u062f"}</button>
          )}
          {user.role==="admin"&&(
            <button onClick={function(){setShowAddLine(true);}} style={{background:"rgba(255,255,255,0.12)",color:C.white,border:"1px solid rgba(255,255,255,0.25)",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ {"\u0625\u0636\u0627\u0641\u0629 \u062e\u0637"}</button>
          )}
          <div style={{background:"rgba(255,255,255,0.12)",borderRadius:8,padding:"5px 11px",display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:12}}>{user.role==="admin"?"👤":user.role==="manager"?"🔧":"👷"}</span>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.85)",fontWeight:500}}>{user.name}</span>
            <Bdg label={RL[user.role]} color={RC[user.role]}/>
          </div>
        </div>
        <div style={{textAlign:"center"}}>
          <img src={LOGO_SRC} alt="National Grid SA" style={{height:28,width:"auto",background:"#fff",borderRadius:6,padding:"2px 6px",display:"block",margin:"0 auto 2px"}}/>
          <div style={{fontSize:14,fontWeight:700,color:C.white}}>{"رادار التعديات"}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.45)",marginTop:1}}>{LINE.name} · {LINE.km} {"\u0643\u0645"} · {ZONES.length} {"\u0645\u0646\u0637\u0642\u0629"}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          {critR.length>0&&<div style={{background:C.red+"22",border:"1px solid "+C.red+"55",borderRadius:8,padding:"4px 10px",display:"flex",alignItems:"center",gap:5}}><SIco status={"\u062c\u062f\u064a\u062f"} size={10}/><span style={{fontSize:11,color:C.red,fontWeight:700}}>{critR.length} {"\u062d\u0631\u062c"}</span></div>}
          {user.role==="admin"&&<button onClick={function(){setShowCfg(function(v){return !v;});}} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"rgba(255,255,255,0.7)",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>⚙</button>}
          <div style={{background:C.white,borderRadius:8,padding:"5px 12px"}}><span style={{fontSize:11,fontWeight:700,color:C.navy}}>{"\u0646\u0642\u0644 \u0627\u0644\u0643\u0647\u0631\u0628\u0627\u0621 ⚡"}</span></div>
          <button onClick={function(){setUser(null);}} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",color:"rgba(255,255,255,0.5)",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{"\u062e\u0631\u0648\u062c"}</button>
        </div>
      </header>

      {/* CONFIG BAR */}
      {showCfg&&<div style={{background:C.navy2,borderBottom:"1px solid "+C.navy3,padding:"8px 18px",display:"flex",gap:12,alignItems:"center",flexShrink:0}}>
        <span style={{fontSize:11,color:"rgba(255,255,255,0.7)",fontWeight:600}}>Sentinel Hub:</span>
        <input value={instanceId} onChange={function(e){setInstanceId(e.target.value);try{window.storage.set("rr_sid",e.target.value);}catch(ex){}}} placeholder="Instance ID (optional)" style={{width:280,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:C.white,borderRadius:8,padding:"5px 11px",fontSize:12}}/>
        <span style={{fontSize:10,color:"rgba(255,255,255,0.45)"}}>{"\u0628\u062f\u0648\u0646\u0647 \u064a\u0633\u062a\u062e\u062f\u0645 Copernicus \u0645\u062c\u0627\u0646\u0627\u064b"}</span>
        <button onClick={function(){setShowCfg(false);}} style={{marginRight:"auto",background:"none",border:"none",color:"rgba(255,255,255,0.5)",cursor:"pointer",fontSize:14}}>&#x2715;</button>
      </div>}

      {/* TABS */}
      <div style={{background:C.white,borderBottom:"2px solid "+C.borderL,padding:"0 18px",display:"flex",flexShrink:0}}>
        {tabs.map(function(t){
          var active = page===t.id;
          return (
            <button key={t.id} onClick={function(){setPage(t.id);}} style={{padding:"11px 16px",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:active?700:500,color:active?C.navy:C.t3,background:"transparent",borderBottom:active?"2px solid "+C.orange:"2px solid transparent",marginBottom:"-2px",transition:"all .15s",display:"flex",alignItems:"center",gap:5}}>
              {t.l}{t.badge>0&&<span style={{background:C.red,color:C.white,borderRadius:10,padding:"1px 6px",fontSize:9,fontWeight:700}}>{t.badge}</span>}
            </button>
          );
        })}
      </div>

      <main style={{flex:1,overflowY:"auto",padding:"16px 18px"}}>

        {/* DASHBOARD */}
        {page==="dashboard"&&(
          <div className="fade">
            <div style={{marginBottom:15}}><h1 style={{fontSize:18,fontWeight:700,color:C.navy,marginBottom:2}}>{"\u0644\u0648\u062d\u0629 \u0627\u0644\u062a\u062d\u0643\u0645 \u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629"}</h1><p style={{fontSize:11,color:C.t3}}>{LINE.name} · {LINE.km} {"\u0643\u0645"} · {"Sentinel-2"}</p></div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:11,marginBottom:14}}>
              {[
                {l:"\u0625\u062c\u0645\u0627\u0644\u064a \u0627\u0644\u0628\u0644\u0627\u063a\u0627\u062a",v:reports.length,sub:openR.length+" \u0645\u0641\u062a\u0648\u062d",c:C.navy,i:"📋"},
                {l:"\u062a\u0639\u062f\u064a\u0627\u062a \u062d\u0631\u062c\u0629",v:critR.length,sub:"\u062a\u062f\u062e\u0644 \u0641\u0648\u0631\u064a",c:C.red,i:"🚨"},
                {l:"\u0645\u0646\u0627\u0637\u0642 \u0645\u0624\u0631\u0634\u0641\u0629",v:blCount,sub:"\u0645\u0646 "+ZONES.length,c:C.green,i:"✓"},
                {l:"\u062a\u063a\u0637\u064a\u0629 \u0627\u0644\u0645\u0633\u062d",v:Math.round(blCount/ZONES.length*100)+"%",sub:blCount+"/"+ZONES.length,c:C.orange,i:"📡"},
              ].map(function(s){
                return (
                  <div key={s.l} className="card" style={{position:"relative",overflow:"hidden",transition:"transform .2s"}} onMouseEnter={function(e){e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={function(e){e.currentTarget.style.transform="";}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}>
                      <div style={{width:34,height:34,borderRadius:9,background:s.c+"14",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,dangerouslySetInnerHTML:{__html:s.i}}}/>
                      <span style={{fontSize:10,color:s.c,background:s.c+"12",padding:"2px 7px",borderRadius:20,alignSelf:"flex-start"}}>{s.sub}</span>
                    </div>
                    <div style={{fontSize:32,fontWeight:800,color:s.c,lineHeight:1,marginBottom:3}}>{s.v}</div>
                    <div style={{fontSize:11,color:C.t3}}>{s.l}</div>

                            {r.prevImgUrl&&<div style={{flex:1}}><div style={{fontSize:10,color:C.t3,textAlign:"center",marginBottom:4}}>{"\u0627\u0644\u0645\u0631\u062c\u0639"}</div><SatImg url={r.prevImgUrl} zone={z} label={"\u0627\u0644\u0645\u0631\u062c\u0639"} alerts={[]} src={r.imgSrc} h={170}/></div>}
                            {r.prevImgUrl&&r.imgUrl&&<div style={{display:"flex",flexDirection:"column",justifyContent:"center",gap:4,fontSize:18,color:C.t4,padding:"0 3px"}}><span>→</span><span style={{fontSize:14,color:col}}>⚠</span></div>}
                            {r.imgUrl&&<div style={{flex:1}}><div style={{fontSize:10,color:C.t3,textAlign:"center",marginBottom:4}}>{"\u0628\u0639\u062f - "+r.date}</div><SatImg url={r.imgUrl} zone={z} label={r.date} alerts={[{severity:r.severity}]} badge={r.severity} src={r.imgSrc} h={170}/></div>}
                          </div>
                          {r.distance_m&&<div style={{marginTop:7,padding:"6px 10px",background:col+"0d",borderRadius:7,fontSize:11,color:col,fontWeight:700,border:"1px solid "+col+"22"}}>{r.distance_m+"m - "+(r.distance_m<=20?"\u062d\u0631\u062c":r.distance_m<=35?"\u0645\u062a\u0648\u0633\u0637":"\u0645\u0646\u062e\u0641\u0636")}</div>}
                        </div>}
                        {/* صور ميدانية */}
                        <FieldPh reportId={r.id}/>
                      </div>
                    );
                  })}
                </div>
            }
          </div>
        )}

        {/* COMPARE */}
        {page==="compare"&&(
          <div className="fade">
            <h1 style={{fontSize:18,fontWeight:700,color:C.navy,marginBottom:3}}>{"\u0645\u0642\u0627\u0631\u0646\u0629 \u0627\u0644\u0635\u0648\u0631"}</h1>
            <p style={{fontSize:11,color:C.t3,marginBottom:14}}>{"\u0623\u0631\u0634\u064a\u0641 \u0642\u0627\u0646\u0648\u0646\u064a - Sentinel-2"}</p>
            {reports.filter(function(r){return r.imgUrl&&r.prevImgUrl;}).length===0
              ? <div className="card" style={{textAlign:"center",padding:60}}><div style={{fontSize:36,marginBottom:12,opacity:.3}}>🛰</div><div style={{fontSize:14,color:C.t3}}>{"\u0644\u0627 \u062a\u0648\u062c\u062f \u0635\u0648\u0631 \u0628\u0639\u062f"}</div></div>
              : reports.filter(function(r){return r.imgUrl&&r.prevImgUrl;}).map(function(r){
                  var z=ZONES.find(function(z){return z.id===r.zoneId;})||ZONES[0];
                  var col=SEV[r.severity]||C.t3;
                  return (
                    <div key={r.id} className="card" style={{marginBottom:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
                        <div style={{display:"flex",gap:8,alignItems:"center"}}><SIco status={r.status} size={18}/><div><div style={{fontSize:13,fontWeight:700,color:C.navy}}>{LINE.name+" - KM "+r.km}</div><div style={{fontSize:11,color:C.t3}}>{r.type}</div></div></div>
                        <div style={{display:"flex",gap:5}}><Bdg label={r.severity} color={col}/><Bdg label={r.status} color={STC[r.status]||C.t3}/></div>
                      </div>
                      <div style={{display:"flex",gap:9}}>
                        <div style={{flex:1}}><div style={{fontSize:10,color:C.t3,textAlign:"center",marginBottom:4}}>{"\u0627\u0644\u0645\u0631\u062c\u0639"}</div><SatImg url={r.prevImgUrl} zone={z} label={"\u0627\u0644\u0645\u0631\u062c\u0639"} alerts={[]} src={r.imgSrc}/></div>
                        <div style={{display:"flex",flexDirection:"column",justifyContent:"center",gap:4,fontSize:18,color:C.t4,padding:"0 4px"}}><span>→</span><span style={{fontSize:14,color:col}}>⚠</span></div>
                        <div style={{flex:1}}><div style={{fontSize:10,color:C.t3,textAlign:"center",marginBottom:4}}>{"+ "+r.date}</div><SatImg url={r.imgUrl} zone={z} label={r.date} alerts={[{severity:r.severity}]} badge={r.severity} src={r.imgSrc}/></div>
                      </div>
                      <div style={{marginTop:8,padding:"7px 10px",background:C.navy+"08",borderRadius:8,fontSize:11,display:"flex",gap:12,flexWrap:"wrap"}}>
                        <span style={{color:C.t2}}>📍 {r.lat.toFixed(5)+"N, "+r.lng.toFixed(5)+"E"}</span>
                        <a href={navUrl(r.lat,r.lng)} target="_blank" style={{color:C.navy,fontWeight:700}}>🧭 {"\u0645\u0644\u0627\u062d\u0629"}</a>
                        <a href={mapUrl(r.lat,r.lng)} target="_blank" style={{color:C.navy,fontWeight:700}}>🗺 {"\u0639\u0631\u0636"}</a>
                      </div>
                    </div>
                  );
                })
            }
          </div>
        )}

        {/* REPORTS */}
        {page==="reports"&&(
          <div className="fade">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div><h1 style={{fontSize:18,fontWeight:700,color:C.navy,marginBottom:2}}>{"\u0627\u0644\u062a\u0642\u0627\u0631\u064a\u0631"}</h1><p style={{fontSize:11,color:C.t3}}>{reports.length+" \u0628\u0644\u0627\u063a"}</p></div>
              <button onClick={function(){var txt="\u062a\u0642\u0631\u064a\u0631 \u0631\u0627\u062f\u0627\u0631 \u0627\u0644\u062d\u0631\u0645\n"+LINE.name+"\n"+today()+"\n\n"+reports.map(function(r){return r.id+"|"+r.type+"|"+r.severity+"|KM "+r.km+"|"+r.status+"|"+r.date;}).join("\n");var bl2=new Blob(["\uFEFF"+txt],{type:"text/plain;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(bl2);a.download="radar_"+today()+".txt";a.click();}} style={{padding:"8px 14px",borderRadius:9,border:"none",background:C.navy,color:C.white,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}}>🖨 {"\u062a\u0635\u062f\u064a\u0631"}</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:11,marginBottom:12}}>
              {[{l:"\u0625\u062c\u0645\u0627\u0644\u064a",v:reports.length,c:C.navy},{l:"\u062d\u0631\u062c\u0629",v:critR.length,c:C.red},{l:"\u0645\u0641\u062a\u0648\u062d\u0629",v:openR.length,c:C.amber},{l:"\u0645\u063a\u0644\u0642\u0629",v:reports.length-openR.length,c:C.green}].map(function(s){return(<div key={s.l} className="card" style={{borderTop:"3px solid "+s.c,textAlign:"center"}}><div style={{fontSize:30,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:11,color:C.t3,marginTop:3}}>{s.l}</div></div>);})}
            </div>
            <div className="card" style={{padding:0,overflow:"hidden"}}>
              <div style={{background:C.navy,padding:"11px 16px",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:13,fontWeight:700,color:C.white}}>{"\u062c\u062f\u0648\u0644 \u0627\u0644\u0628\u0644\u0627\u063a\u0627\u062a"}</span><span style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{reports.length+" \u0633\u062c\u0644"}</span></div>
              {reports.length===0?<div style={{textAlign:"center",padding:28,color:C.t4,fontSize:12}}>{"\u0644\u0627 \u0628\u064a\u0627\u0646\u0627\u062a"}</div>
                :reports.map(function(r){
                    var col=SEV[r.severity]||C.t3;
                    return(<div key={r.id} onClick={function(){setSel(r);setPage("alerts");}} style={{padding:"9px 16px",display:"grid",gridTemplateColumns:"32px 90px 60px 70px 1fr 80px 100px",gap:7,alignItems:"center",borderBottom:"1px solid "+C.borderL,cursor:"pointer",transition:"background .15s"}} onMouseEnter={function(e){e.currentTarget.style.background=C.bg;}} onMouseLeave={function(e){e.currentTarget.style.background=C.white;}}>
                      <SIco status={r.status} size={14}/>
                      <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:C.navy}}>{r.id}</span>
                      <Bdg label={r.severity} color={col} size={9}/>
                      <span style={{fontSize:11}}>{TIC[r.type]||"\u26A0"}</span>
                      <span style={{fontSize:11,color:C.t2}}>{r.description?(r.description.slice(0,40)+"..."):"—"}</span>
                      <span style={{fontSize:10,color:C.t4}}>{r.date}</span>
                      <Bdg label={r.status} color={STC[r.status]||C.t3} size={9}/>
                    </div>);
                })
              }
            </div>
          </div>
        )}

      </main>

      {/* SCAN MODAL */}
      {showScan&&<ScanModal onClose={function(){setShowScan(false);setInitZone(null);}} onResult={onResult} bl={bl} saveBL={saveBL} iid={instanceId} initZone={initZone}/>}

      {/* ADD LINE MODAL */}
      {showAddLine&&(
        <div style={{position:"fixed",inset:0,background:"rgba(26,46,94,0.65)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:C.white,borderRadius:14,width:"100%",maxWidth:500,direction:"rtl",boxShadow:"0 24px 80px rgba(26,46,94,0.4)"}}>
            <div style={{background:C.navy,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",borderRadius:"14px 14px 0 0"}}>
              <div style={{fontSize:15,fontWeight:700,color:C.white}}>+ {"\u0625\u0636\u0627\u0641\u0629 \u062e\u0637 \u0646\u0642\u0644 \u062c\u062f\u064a\u062f"}</div>
              <button onClick={function(){setShowAddLine(false);}} style={{background:"rgba(255,255,255,0.15)",border:"none",color:C.white,cursor:"pointer",width:32,height:32,borderRadius:"50%",fontSize:16}}>&#x2715;</button>
            </div>
            <div style={{padding:22}}>
              <div style={{background:"#f0fff4",border:"1px solid "+C.green+"44",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
                <div style={{fontSize:13,fontWeight:700,color:C.green,marginBottom:6}}>{"\u0645\u064a\u0632\u0629 \u0642\u0627\u062f\u0645\u0629 \u0642\u0631\u064a\u0628\u0627\u064b"}</div>
                <div style={{fontSize:12,color:C.t2,lineHeight:1.9}}>{"\u0633\u062a\u062a\u0645\u0643\u0646 \u0645\u0646 \u0631\u0641\u0639 \u0645\u0644\u0641\u0627\u062a KML \u0644\u0623\u064a \u062e\u0637 \u0648\u062a\u0648\u0644\u064a\u062f \u0645\u0646\u0627\u0637\u0642 \u0627\u0644\u0645\u0633\u062d \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b."}</div>
              </div>
              <div style={{background:C.bg,borderRadius:9,padding:"11px 13px",border:"1px solid "+C.borderL,marginBottom:14}}>
                <div style={{fontSize:10,fontWeight:700,color:C.navy,marginBottom:8}}>{"\u0627\u0644\u062e\u0637 \u0627\u0644\u062d\u0627\u0644\u064a"}</div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:10,height:10,borderRadius:2,background:C.orange}}/>
                  <div><div style={{fontSize:12,fontWeight:700,color:C.navy}}>{LINE.name}</div><div style={{fontSize:10,color:C.t3}}>{LINE.km+" \u0643\u0645 - "+LINE.towers+" \u0628\u0631\u062c - "+ZONES.length+" \u0645\u0646\u0637\u0642\u0629"}</div></div>
                  <Bdg label={"\u0645\u064f\u0641\u0639\u064e\u0651\u0644"} color={C.green}/>
                </div>
              </div>
              <button onClick={function(){setShowAddLine(false);}} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",background:"linear-gradient(135deg,"+C.navy+","+C.navy3+")",color:C.white,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>{"\u0645\u0648\u0627\u0641\u0642"}</button>
            </div>
          </div>
        </div>
      )}

      {/* TOASTS */}
      <div style={{position:"fixed",top:64,left:14,zIndex:9999,display:"flex",flexDirection:"column",gap:7,pointerEvents:"none"}}>
        {toasts.map(function(t){return(
          <div key={t.id} style={{background:C.white,border:"1px solid "+(t.color||C.navy)+"44",borderRight:"4px solid "+(t.color||C.navy),borderRadius:10,padding:"10px 14px",minWidth:270,display:"flex",gap:9,alignItems:"flex-start",boxShadow:"0 8px 24px rgba(26,46,94,0.18)",animation:"slideIn .3s ease",pointerEvents:"all"}}>
            <span style={{fontSize:18,flexShrink:0}}>{t.icon}</span>
            <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:C.navy,marginBottom:2}}>{t.title}</div><div style={{fontSize:11,color:C.t3}}>{t.body}</div></div>
            <button onClick={function(){setToasts(function(old){return old.filter(function(x){return x.id!==t.id;});});}} style={{background:"none",border:"none",color:C.t4,cursor:"pointer",fontSize:14}}>&#x2715;</button>
          </div>
        );})}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

  </script>
</body>
</html>
